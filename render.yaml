services:
  - type: web
    name: ai-server
    runtime: python
    plan: free
    buildCommand: |
      apt-get update -qq && apt-get install -y python3-dev build-essential
      python -m pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir --no-build-isolation -r requirements.txt
    startCommand: "gunicorn app:app --timeout 180 --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"          
      - key: PORT
        value: "10000"
