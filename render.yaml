services:
  - type: web
    name: ai-server
    runtime: python
    plan: free
    pythonVersion: "3.12"
    buildCommand: |
      apt-get update -qq && apt-get install -y --no-install-recommends python3-dev build-essential
      python -m pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
    startCommand: "gunicorn app:app --timeout 180 --workers 1"
    envVars:
      - key: PORT
        value: "10000"
