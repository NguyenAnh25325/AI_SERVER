services:
  - type: web
    name: ai-server
    runtime: python          
    plan: free
    pythonVersion: "3.12"   
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
    startCommand: "gunicorn app:app --timeout 120"
    envVars:
      - key: PORT
        value: "10000"
